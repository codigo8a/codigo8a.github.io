<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Antenna -->
  <path d="M9 12 L19 2" stroke="#404040" stroke-width="1.5" fill="none"/>
  <circle cx="19.5" cy="1.5" r="1.5" fill="#808080" stroke="#000" stroke-width="0.6"/>

  <!-- Body -->
  <rect x="2" y="11" width="28" height="18" rx="2" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
  <!-- Bevel -->
  <path d="M3.5 12.5 H28.5" stroke="#ffffff" stroke-width="1"/>
  <path d="M3.5 27.5 H28.5" stroke="#808080" stroke-width="1"/>

  <!-- Speaker grille -->
  <rect x="5" y="15" width="13" height="11" fill="#808080" stroke="#000" stroke-width="0.8"/>
  <rect x="6.5" y="17" width="10" height="1" fill="#404040"/>
  <rect x="6.5" y="19.5" width="10" height="1" fill="#404040"/>
  <rect x="6.5" y="22" width="10" height="1" fill="#404040"/>
  <rect x="6.5" y="24.5" width="10" height="0.8" fill="#404040"/>

  <!-- Tuner display -->
  <rect x="20" y="13.5" width="8" height="5" fill="#ffffff" stroke="#000" stroke-width="0.8"/>
  <rect x="24.5" y="14.5" width="0.9" height="3" fill="#c00000"/>

  <!-- Buttons -->
  <rect x="20" y="20" width="3" height="3" fill="#c0c0c0" stroke="#000" stroke-width="0.7"/>
  <rect x="25" y="20" width="3" height="3" fill="#c0c0c0" stroke="#000" stroke-width="0.7"/>

  <!-- Dial -->
  <circle cx="24" cy="26" r="2.3" fill="#c0c0c0" stroke="#000" stroke-width="0.8"/>
  <rect x="23.6" y="24" width="0.8" height="2" fill="#404040"/>
</svg>
